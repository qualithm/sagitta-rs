# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
ignore = [
    # chrono and chrono-tz are unmaintained, but arrow and datafusion depend on them, and no
    # release of either has moved off them. Remove these ignores once neither is locked.
    # https://rustsec.org/advisories/RUSTSEC-2026-0543
    "RUSTSEC-2026-0543",
    # https://rustsec.org/advisories/RUSTSEC-2026-0555
    "RUSTSEC-2026-0555",
    # humantime is unmaintained because it wraps chrono; object_store depends on it. Remove this
    # ignore once humantime is no longer locked.
    # https://rustsec.org/advisories/RUSTSEC-2026-0542
    "RUSTSEC-2026-0542",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "bzip2-1.0.6",
    "ISC",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = [
    # tokio's dependencies use different versions of windows-sys
    { crate = "windows-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
