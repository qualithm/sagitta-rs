# Generated by dx/scripts/image-audit-sync from ci-templates/image-audit-docker.yaml.
# Do not edit directly — change the template and re-run image-audit-sync.

name: Image Audit

on:
  schedule:
    - cron: "0 7 * * 1" # Weekly, Monday 07:00 UTC (after the 06:00 daily dependency audits)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Image Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: updatecli/updatecli-action@d422ba543720d01a96d4c3e3ab8544cc188cd711 # v3.5.0
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - name: Audit pinned images
        id: audit
        uses: ./.github/actions/image-audit
        with:
          mode: docker
      - name: Load report body
        id: report
        if: steps.audit.outputs.clean == 'false'
        shell: bash
        run: |
          {
            echo "body<<IMAGE_AUDIT_BODY_EOF"
            cat "${{ steps.audit.outputs.body-file }}"
            echo "IMAGE_AUDIT_BODY_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Report findings
        if: steps.audit.outputs.clean == 'false'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title:
            "${{ github.event.repository.name }}: image audit found outdated or vulnerable images"
          body: ${{ steps.report.outputs.body }}
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale findings issue
        if: steps.audit.outputs.clean == 'true'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title:
            "${{ github.event.repository.name }}: image audit found outdated or vulnerable images"
          github-token: ${{ steps.app-token.outputs.token }}
      # Findings are advisory: the job never fails on them, the tracking issue
      # is the report (Decision https://github.com/orgs/qualithm/discussions/232).
