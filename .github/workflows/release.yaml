# Generated by dx/scripts/release-sync from ci-templates/release-rust.yaml.
# Do not edit directly — change the template and re-run release-sync.

name: Release

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # One Rust for every job, the rust image's version in dx images.json.
  # dx config check holds every template to it.
  RUST_VERSION: "1.99.1"
  BINARY_NAME: sagitta

jobs:
  build-binaries:
    if: ${{ !endsWith(github.repository, '-example') }}
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          # Build on ubuntu-24.04 (GLIBC 2.39) for compatibility with debian:trixie-slim (GLIBC 2.41)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "release-${{ matrix.os }}-${{ matrix.target }}"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --package ${{ env.BINARY_NAME }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}
          retention-days: 1

  docker:
    if: ${{ !endsWith(github.repository, '-example') }}
    name: Build Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-binaries
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download amd64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.BINARY_NAME }}-linux-amd64
          path: binaries/linux/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.BINARY_NAME }}-linux-arm64
          path: binaries/linux/arm64

      - name: Make binaries executable
        run: chmod +x binaries/linux/*/${{ env.BINARY_NAME }}

      # Every architecture builds natively: a stage not pinned to
      # $BUILDPLATFORM is built for each target, so a RUN there would need
      # QEMU emulation.
      - name: Check the Dockerfile builds without emulation
        env:
          DOCKERFILE: docker/Dockerfile.release
        run: |
          awk '
            toupper($1) == "FROM" { native = ($0 ~ /--platform=\$BUILDPLATFORM/) }
            toupper($1) == "RUN" && !native {
              printf "::error file=%s,line=%d::RUN in a stage built for the target platform; pin the stage to --platform=$BUILDPLATFORM or copy a prebuilt artifact instead\n", FILENAME, NR
              bad = 1
            }
            END { exit bad }
          ' "$DOCKERFILE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          # The runner is discarded after the job, so skip the 10s builder
          # teardown that tips Publish Image past a billed minute (qualithm/pm#3021).
          cleanup: false

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ env.BINARY_NAME }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No layer cache: with nothing emulated, rebuilding the layers takes a few
      # seconds, and exporting them to the Actions cache took most of a minute
      # (qualithm/pm#3021).
      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BINARY_NAME=${{ env.BINARY_NAME }}

      - name: Test image health
        run: |
          # Distroless has no shell; invoke the binary directly.
          docker run --rm "${{ env.IMAGE }}:sha-${GITHUB_SHA::7}" --version

  # Scans an image the release just pushed for fixable high and critical
  # vulnerabilities and files a scan-failure issue on pm. It reports without
  # blocking: the image is already pushed, and a finding never fails the run.
  scan-image:
    name: Scan image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: docker
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/actions

      - name: Install Trivy
        env:
          # Pinned release plus the sha256 of its Linux-64bit tarball from the
          # release's checksums file. Bump both values together.
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy

      # Trivy reads registry credentials from the Docker config by host, so its
      # vulnerability DB still downloads anonymously.
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every platform the release pushes, since a digest alone names only the
      # runner's. Only findings with a fixed version count: an unfixable one has
      # no action to take. The tables go to the log; the merged JSON feeds the
      # issue. The step fails on a finding, and `scanned` tells that apart from a
      # scan that could not run.
      - name: Scan the image
        id: scan
        continue-on-error: true
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.docker.outputs.image-digest }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trivy" image --download-db-only --no-progress
          for platform in linux/amd64 linux/arm64; do
            "$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --skip-db-update --no-progress --platform "$platform" --format json \
              --output "$RUNNER_TEMP/trivy-${platform#*/}.json" "$IMAGE_REF"
            echo "::group::$platform"
            "$RUNNER_TEMP/trivy" convert --format table "$RUNNER_TEMP/trivy-${platform#*/}.json"
            echo "::endgroup::"
          done
          jq -s '[.[] | .Results[]?.Vulnerabilities[]?]
            | unique_by(.VulnerabilityID + .PkgName + .InstalledVersion)
            | sort_by(.Severity, .VulnerabilityID)' "$RUNNER_TEMP"/trivy-*.json \
            > "$RUNNER_TEMP/findings.json"
          echo "scanned=true" >> "$GITHUB_OUTPUT"
          [[ "$(jq length "$RUNNER_TEMP/findings.json")" -eq 0 ]]

      # The table is capped to keep the issue body under GitHub's size limit.
      - name: Summarise findings
        id: findings
        if: steps.scan.outcome == 'failure'
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.docker.outputs.image-digest }}
          SCANNED: ${{ steps.scan.outputs.scanned }}
          MAX_ROWS: 150
        run: |
          set -euo pipefail
          findings="$RUNNER_TEMP/findings.json"
          if [[ "$SCANNED" != "true" ]]; then
            echo "severity=high" >> "$GITHUB_OUTPUT"
            printf 'body=%s\n' "Trivy could not scan \`$IMAGE_REF\`; see the run log." >> "$GITHUB_OUTPUT"
            echo "::warning::Trivy could not scan $IMAGE_REF"
            exit 0
          fi
          if jq -e 'any(.Severity == "CRITICAL")' "$findings" > /dev/null; then
            echo "severity=critical" >> "$GITHUB_OUTPUT"
          else
            echo "severity=high" >> "$GITHUB_OUTPUT"
          fi
          total="$(jq length "$findings")"
          {
            echo "body<<EOF_BODY"
            echo "Trivy found fixable high or critical vulnerabilities in \`$IMAGE_REF\`."
            echo
            echo "| ID | Severity | Package | Installed | Fixed |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r --argjson max "$MAX_ROWS" '.[:$max][]
              | "| \(.VulnerabilityID) | \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) |"' \
              "$findings"
            if (( total > MAX_ROWS )); then
              echo
              echo "And $((total - MAX_ROWS)) more; see the run log."
            fi
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"
          echo "::warning::Trivy found $total fixable high or critical vulnerabilities in $IMAGE_REF"

      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm

      - name: Report findings
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: Trivy found a vulnerability in the image"
          severity: ${{ steps.findings.outputs.severity }}
          body: ${{ steps.findings.outputs.body }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Resolve stale findings issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: Trivy found a vulnerability in the image"
          github-token: ${{ steps.app-token.outputs.token }}

  publish-crate:
    if: ${{ !endsWith(github.repository, '-example') }}
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "release-publish"

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth

      - name: Check if version exists on crates.io
        id: version_check
        run: |
          set -euo pipefail
          CRATE_NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "${{ env.BINARY_NAME }}") | .name')
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "${{ env.BINARY_NAME }}") | .version')
          echo "crate=$CRATE_NAME@$CRATE_VERSION" >> "$GITHUB_OUTPUT"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: github-actions/${{ github.repository }}" "https://crates.io/api/v1/crates/$CRATE_NAME/$CRATE_VERSION")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$CRATE_NAME@$CRATE_VERSION already published, skipping"
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$CRATE_NAME@$CRATE_VERSION not found, will publish"
          else
            echo "::error::Unexpected HTTP status $HTTP_STATUS from crates.io API"
            exit 1
          fi

      - name: Publish to crates.io
        if: steps.version_check.outputs.exists == 'false'
        run: cargo publish --package ${{ env.BINARY_NAME }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    if: ${{ !endsWith(github.repository, '-example') }}
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [docker, publish-crate]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release for $TAG already exists, skipping"
            exit 0
          fi

          # PREV_TAG is the most recent tag reachable before this one, if any.
          PREV_TAG=$(git tag --sort=-creatordate --merged "$TAG" | grep -Fxv "$TAG" | head -1 || true)

          # Injected from dx ci-templates/_changelog-notes.py by release-sync — do not
          # hand-edit; change the source script and re-run release-sync.
          # Recursively unpacks squashed promotion-hop commits back to their
          # real leaf commits, since neither `gh release create
          # --generate-notes` nor GoReleaser's `changelog.use: github` can see
          # past the single squash-commit each development -> test -> main
          # hop produces.
          cat > /tmp/changelog-notes.py <<'PYEOF'
          # changelog-notes — build real release notes for a tag by recursively unpacking
          # squashed promotion-hop commits back to their leaf feat/fix/etc. commits.
          #
          # Neither `gh release create --generate-notes` nor GoReleaser's `changelog.use:
          # github` can do this: both only ever see one squash-commit per development ->
          # test -> main promotion hop, never the real commits that were squashed away.
          # This script walks the commit range for a tag, and for each commit whose title
          # matches the promotion-hop shape, looks up that PR's pre-squash commit list via
          # the GitHub API and recurses into it, until it reaches real leaf commits.
          #
          # Usage:
          #   changelog-notes --repo owner/name --tag TAG [--prev-tag PREV] [--repo-dir DIR]
          #
          # Requires: gh (authenticated), git (run inside, or --repo-dir pointing at, a
          # checkout with full history/tags — i.e. actions/checkout with fetch-depth: 0).
          #
          # Prints the release body (## What's Changed / ## Full Changelog) to stdout.
          import argparse
          import json
          import re
          import subprocess
          import sys

          # Promotion-hop PRs come in a couple of title shapes: dx git merge synthesises
          # "Promote <src> → <dst> (N commits)" (Unicode arrow + count), but older/manual
          # promotions use a bare "Promote <src> -> <dst>" (ASCII arrow, no count). Match
          # both arrows and treat the count as optional so neither slips through as a leaf.
          PROMOTION_TITLE = re.compile(r"^(Promote .* (?:→|->) .*|Merge .* into (main|test|development))")
          LEAF_EXCLUDE = [
              re.compile(r"^docs(\(.+\))?!?:"),
              re.compile(r"^test(\(.+\))?!?:"),
              re.compile(r"^chore(\(.+\))?!?:"),
              re.compile(r"^ci(\(.+\))?!?:"),
              re.compile(r"Merge pull request"),
              re.compile(r"Merge branch"),
          ]


          def gh_api_json(path, method="GET", fields=None):
              cmd = ["gh", "api", path]
              if method != "GET":
                  cmd += ["-X", method]
              for k, v in (fields or {}).items():
                  cmd += ["-f", f"{k}={v}"]
              out = subprocess.run(cmd, capture_output=True, text=True)
              if out.returncode != 0:
                  # Surface the failure so a permission/auth/rate-limit error (which would
                  # otherwise silently degrade every promotion PR to a bare commit entry)
                  # is visible in the log rather than producing wrong-but-green notes.
                  print(f"warning: gh api {path} failed: {out.stderr.strip()}", file=sys.stderr)
                  return None, out.stderr
              return json.loads(out.stdout), None


          class Resolver:
              def __init__(self, repo, repo_dir):
                  self.repo = repo
                  self.repo_dir = repo_dir
                  self.cache = {}

              def pr_for_commit(self, sha):
                  key = f"commit_pr:{sha}"
                  if key in self.cache:
                      return self.cache[key]
                  prs, _ = gh_api_json(f"repos/{self.repo}/commits/{sha}/pulls")
                  result = None
                  if prs:
                      merged = [p for p in prs if p.get("merged_at")]
                      if merged:
                          p = merged[0]
                          result = {
                              "number": p["number"],
                              "title": p["title"],
                              "author": (p.get("user") or {}).get("login"),
                              "url": p.get("html_url"),
                          }
                  self.cache[key] = result
                  return result

              def pr_commits(self, number):
                  key = f"pr_commits:{number}"
                  if key in self.cache:
                      return self.cache[key]
                  commits, _ = gh_api_json(f"repos/{self.repo}/pulls/{number}/commits")
                  result = [c["sha"] for c in (commits or [])]
                  self.cache[key] = result
                  return result

              def commit_info(self, sha):
                  key = f"commit_info:{sha}"
                  if key in self.cache:
                      return self.cache[key]
                  data, _ = gh_api_json(f"repos/{self.repo}/commits/{sha}")
                  author = (data or {}).get("author") or {}
                  msg = subprocess.run(
                      ["git", "-C", self.repo_dir, "log", "-1", "--pretty=format:%s", sha],
                      capture_output=True, text=True, check=True,
                  ).stdout.strip()
                  result = {
                      "title": msg,
                      "author": author.get("login"),
                      "url": f"https://github.com/{self.repo}/commit/{sha}",
                  }
                  self.cache[key] = result
                  return result

              def resolve_leaves(self, sha, seen, depth=0):
                  if sha in seen or depth > 12:
                      return []
                  seen.add(sha)
                  pr = self.pr_for_commit(sha)
                  if pr and PROMOTION_TITLE.match(pr["title"]):
                      leaves = []
                      for inner_sha in self.pr_commits(pr["number"]):
                          leaves.extend(self.resolve_leaves(inner_sha, seen, depth + 1))
                      return leaves
                  return [pr if pr else self.commit_info(sha)]


          def excluded(title):
              return any(p.search(title) for p in LEAF_EXCLUDE)


          def format_bullet(leaf):
              title, author, url = leaf["title"], leaf.get("author"), leaf.get("url")
              if author and url:
                  return f"- {title} by @{author} in {url}"
              if url:
                  return f"- {title} in {url}"
              return f"- {title}"


          def leaf_key(leaf):
              """Stable identity for a leaf: its PR number if known, else its title."""
              number = leaf.get("number")
              return f"#{number}" if number else leaf["title"]


          def collect_leaves(resolver, repo_dir, rng):
              log = subprocess.run(
                  ["git", "-C", repo_dir, "log", rng, "--pretty=format:%H", "--reverse"],
                  capture_output=True, text=True, check=True,
              ).stdout
              shas = [s for s in log.split("\n") if s.strip()]
              seen = set()
              leaves = []
              for sha in shas:
                  leaves.extend(resolver.resolve_leaves(sha, seen))
              return leaves


          def build_bullets(repo, repo_dir, prev, tag):
              resolver = Resolver(repo, repo_dir)
              rng = f"{prev}..{tag}" if prev else tag
              all_leaves = collect_leaves(resolver, repo_dir, rng)

              # A promotion PR's commit list (from the GitHub API) can reach commits from
              # before this release window — long-lived development/test branches and
              # branch-alignment resets both cause this — so the recursion may surface
              # PRs that already shipped in an earlier tag. The prev..tag git range only
              # bounds the top-level promotion commits, not the recursion, and squash
              # merges rule out SHA-ancestry filtering. Subtract everything reachable from
              # prev so an already-released PR never reappears in a later release.
              released = set()
              if prev:
                  released = {leaf_key(leaf) for leaf in collect_leaves(resolver, repo_dir, prev)}

              bullets, seen_keys = [], set()
              for leaf in reversed(all_leaves):  # newest first
                  key = leaf_key(leaf)
                  if key in released or key in seen_keys or excluded(leaf["title"]):
                      continue
                  seen_keys.add(key)
                  bullets.append(format_bullet(leaf))
              return bullets


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--repo", required=True, help="owner/name")
              ap.add_argument("--tag", required=True)
              ap.add_argument("--prev-tag", default=None)
              ap.add_argument("--repo-dir", default=".")
              args = ap.parse_args()

              bullets = build_bullets(args.repo, args.repo_dir, args.prev_tag, args.tag)
              parts = ["## What's Changed", ""]
              parts.extend(bullets)
              parts.append("")
              parts.append("## Full Changelog")
              parts.append("")
              if args.prev_tag:
                  parts.append(f"**Full Changelog**: https://github.com/{args.repo}/compare/{args.prev_tag}...{args.tag}")
              print("\n".join(parts))


          if __name__ == "__main__":
              main()
          PYEOF

          if [[ -n "$PREV_TAG" ]]; then
            python3 /tmp/changelog-notes.py --repo "$GH_REPO" --tag "$TAG" --prev-tag "$PREV_TAG" > /tmp/notes.md
          else
            python3 /tmp/changelog-notes.py --repo "$GH_REPO" --tag "$TAG" > /tmp/notes.md
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file /tmp/notes.md
