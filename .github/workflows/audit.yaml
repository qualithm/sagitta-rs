# Generated by dx/scripts/audit-sync from ci-templates/audit-rust.yaml.
# Do not edit directly — change the template and re-run audit-sync.

name: Security Audit

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: Security Advisory Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Read advisory ignores from deny.toml
        id: ignores
        shell: bash
        run: |
          # cargo-deny reads deny.toml; cargo audit does not. Bridge the repo's
          # reviewed/justified ignore list into the audit so the two jobs agree
          # (qualithm/pm#405). Comments are stripped and IDs deduped; an absent or empty
          # list yields an empty ignore input.
          ids=""
          if [ -f deny.toml ]; then
            ids=$(
              awk '/^\[advisories\]/{a=1;next} /^\[/{a=0} a && $0 ~ /ignore/ && $0 ~ /\[/ {i=1; next} i && /^\]/{i=0} i' deny.toml \
                | sed 's/#.*//' | { grep -oE 'RUSTSEC-[0-9]+-[0-9]+' || true; } | sort -u | paste -sd, -
            )
          fi
          echo "advisories=${ids}" >> "$GITHUB_OUTPUT"
      # Install locked: an unlocked install breaks whenever a fresh dependency outruns the
      # runner's rustc.
      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked
      # Run cargo audit directly: rustsec/audit-check also files each finding as an issue
      # in this repo, where issues are off. Findings reach pm through report-scan-failure.
      # Only vulnerabilities fail; informational warnings (unsound, unmaintained) don't.
      - name: RustSec audit
        id: scan
        continue-on-error: true
        shell: bash
        env:
          IGNORES: ${{ steps.ignores.outputs.advisories }}
        run: |
          args=()
          IFS=, read -ra ids <<< "$IGNORES"
          for id in "${ids[@]}"; do args+=(--ignore "$id"); done
          cargo audit "${args[@]}"
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: RustSec found an advisory"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: RustSec found an advisory"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1

  deny:
    name: Dependency Audit (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: cargo-deny
        id: scan
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2.0.18
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: cargo-deny flagged a policy violation"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: cargo-deny flagged a policy violation"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1

  udeps:
    name: Unused Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: nightly
      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "udeps"
      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked
      - name: Check unused dependencies
        id: scan
        continue-on-error: true
        run: cargo +nightly udeps --workspace
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: cargo-udeps found unused dependencies"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: cargo-udeps found unused dependencies"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
