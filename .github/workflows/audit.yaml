# Generated by dx/scripts/audit-sync from ci-templates/audit-rust.yaml.
# Do not edit directly — change the template and re-run audit-sync.

name: Security Audit

# Advisory scans run daily; every job runs on Mondays and on a push that
# changes a dependency.
on:
  schedule:
    - cron: "0 6 * * 0,2-6" # Daily at 06:00 UTC, except Monday
    - cron: "0 6 * * 1" # Monday at 06:00 UTC: every job
  push:
    branches: [development, main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yaml"
  workflow_dispatch: {}

# A newer push supersedes an older one; schedules queue apart from pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Security Advisory Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Read advisory ignores from deny.toml
        id: ignores
        shell: bash
        run: |
          # cargo-deny reads deny.toml; cargo audit does not. Bridge the repo's
          # reviewed/justified ignore list into the audit so the two jobs agree
          # (qualithm/pm#405). Comments are stripped and IDs deduped; an absent or empty
          # list yields an empty ignore input.
          ids=""
          if [ -f deny.toml ]; then
            ids=$(
              awk '/^\[advisories\]/{a=1;next} /^\[/{a=0} a && $0 ~ /ignore/ && $0 ~ /\[/ {i=1; next} i && /^\]/{i=0} i' deny.toml \
                | sed 's/#.*//' | { grep -oE 'RUSTSEC-[0-9]+-[0-9]+' || true; } | sort -u | paste -sd, -
            )
          fi
          echo "advisories=${ids}" >> "$GITHUB_OUTPUT"
      # A prebuilt binary: building it from source took minutes (qualithm/pm#3019).
      - name: Install cargo-audit
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-audit@0.22.2
      # Run cargo audit directly: rustsec/audit-check also files each finding as an issue
      # in this repo, where issues are off. Findings reach pm through report-scan-failure.
      # Only vulnerabilities fail; informational warnings (unsound, unmaintained) don't.
      - name: RustSec audit
        id: scan
        continue-on-error: true
        shell: bash
        env:
          IGNORES: ${{ steps.ignores.outputs.advisories }}
        run: |
          args=()
          IFS=, read -ra ids <<< "$IGNORES"
          for id in "${ids[@]}"; do args+=(--ignore "$id"); done
          cargo audit "${args[@]}"
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: RustSec found an advisory"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: RustSec found an advisory"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1

  deny:
    name: Dependency Audit (cargo-deny)
    # Weekly: what it checks changes only with the code or dependencies.
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: cargo-deny
        id: scan
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2.0.18
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: cargo-deny flagged a policy violation"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: cargo-deny flagged a policy violation"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1

  udeps:
    name: Unused Dependencies
    # Weekly: what it checks changes only with the code or dependencies.
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # cargo-shear parses manifests and sources on stable, so nothing compiles
      # and no cache is saved. Silence a false positive with
      # [package.metadata.cargo-shear] ignored = ["crate"].
      - name: Install cargo-shear
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-shear@1.14.0
      - name: Check unused dependencies
        id: scan
        continue-on-error: true
        run: cargo shear
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: cargo-shear found unused dependencies"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: cargo-shear found unused dependencies"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1

  fuzz:
    name: Fuzz
    # Weekly or on dispatch, with the corpus carried from run to run; a push would
    # hold every promotion behind the fuzz time. A repo without fuzz/ skips the run.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-24.04
    # The largest builds take most of an hour on two jobs, before the fuzz time.
    timeout-minutes: 90
    env:
      FUZZ_SECONDS: 600
      FUZZ_TOOLCHAIN: nightly-2026-10-01
      # The prebuilt cargo-fuzz is a static musl binary and would default to its own target.
      FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu
      # An AddressSanitizer build of a large dependency tree runs the runner out of memory, and
      # safe Rust panics reach libFuzzer without one. Two build jobs keep the largest trees in memory.
      FUZZ_SANITIZER: none
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Find the fuzz targets
        id: targets
        run: |
          if [ -f fuzz/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "no fuzz/ crate: nothing to fuzz"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # A large dependency tree's fuzz build fills the runner's default disk.
      - name: Free disk space
        if: steps.targets.outputs.present == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      # The largest crates' instrumented builds outgrow the runner's memory; swap absorbs the peak.
      - name: Add swap
        if: steps.targets.outputs.present == 'true'
        run: |
          sudo fallocate -l 16G /fuzz-swapfile
          sudo chmod 600 /fuzz-swapfile
          sudo mkswap /fuzz-swapfile
          sudo swapon /fuzz-swapfile
          free -m
      # cargo-fuzz needs nightly for the sanitizer flags; the date keeps runs comparable.
      - name: Install the nightly toolchain
        if: steps.targets.outputs.present == 'true'
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - name: Install cargo-fuzz
        if: steps.targets.outputs.present == 'true'
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-fuzz@0.12.0
      # Each run saves under a new key and restores the newest, so the corpus grows.
      - name: Restore the fuzz corpus
        if: steps.targets.outputs.present == 'true'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run every fuzz target
        id: scan
        if: steps.targets.outputs.present == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          status=0
          for target in $(cargo "+$FUZZ_TOOLCHAIN" fuzz list); do
            echo "::group::${target}"
            # libFuzzer writes new inputs into the first directory, so the corpus leads and
            # the committed seeds only feed it.
            dirs=("fuzz/corpus/${target}")
            mkdir -p "${dirs[0]}"
            [ -d "fuzz/seeds/${target}" ] && dirs+=("fuzz/seeds/${target}")
            if ! cargo "+$FUZZ_TOOLCHAIN" fuzz run --target "$FUZZ_TARGET_TRIPLE" --sanitizer "$FUZZ_SANITIZER" "$target" "${dirs[@]}" -- -max_total_time="$FUZZ_SECONDS" 2>&1 | tee fuzz.log; then
              status=1
              {
                echo "### ${target}"
                echo
                echo '```'
                grep -v '^#[0-9]' fuzz.log | tail -40
                echo '```'
                echo
              } >> fuzz-report.md
            fi
            echo "::endgroup::"
          done
          exit "$status"
      - name: Report disk and memory
        if: always() && steps.targets.outputs.present == 'true'
        run: |
          df -h /
          free -m
      - name: Save the fuzz corpus
        if: always() && steps.targets.outputs.present == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload the crashers
        id: crashers
        if: steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: fuzz/artifacts/**
          retention-days: 90
      - name: Write the report
        id: report
        if: steps.scan.outcome == 'failure'
        env:
          ARTIFACT_URL: ${{ steps.crashers.outputs.artifact-url }}
        run: |
          {
            echo "body<<FUZZ_REPORT_EOF"
            echo "A fuzz target failed. Download the crashers (${ARTIFACT_URL}) into fuzz/artifacts,"
            echo "then reproduce with \`cargo +${FUZZ_TOOLCHAIN} fuzz run --target ${FUZZ_TARGET_TRIPLE} --sanitizer ${FUZZ_SANITIZER} <target> fuzz/artifacts/<target>/<file>\`."
            echo
            cat fuzz-report.md
            echo "FUZZ_REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: a fuzz target found a crasher"
          body: ${{ steps.report.outputs.body }}
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: a fuzz target found a crasher"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
