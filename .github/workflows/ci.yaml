# Generated by dx/scripts/ci-sync from ci-templates/rust-lib.yaml.
# Do not edit directly — change the template and re-run ci-sync.

name: CI

on:
  pull_request:
    branches: [main, test, development]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.f.outputs.code }}
      is-main: ${{ steps.tier.outputs.is-main }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.githooks/**'
              - '!.vscode/**'
              - '!docker/**'
              - '!justfile'
              - '!scripts/**'
              - '!LICENSE'
      - id: tier
        run: |
          if [[ "${{ github.base_ref }}" == "main" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "is-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-main=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & Test
    needs: changes
    # Also runs on push to main. Actions caches are readable only from the branch
    # that wrote them plus the default branch, so a job that never runs on main
    # never seeds a cache any other branch can restore.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # No "Free disk space" step: measured on varv-rs (qualithm/pm#451), the runner starts
      # at ~15G free and peak target/ is ~5G, so the ~60-115s cleanup freed ~19G the
      # job never needs. `doc` (below) has always run without it.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "dev"
          # PRs restore but never save. A PR-run cache is scoped to refs/pull/N/merge,
          # which no other branch can read and which dies with the PR — so saving one
          # only churns the repo's 10GB LRU budget and evicts the main-scoped cache
          # every PR actually restores from.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Runs here rather than in a separate job. check/clippy emit only .rmeta, so
      # this still pays for all codegen and linking — but a separate job would pay
      # that *and* repeat the type-check, disk cleanup, and toolchain setup.
      - run: cargo test --workspace

  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # No "Free disk space" step: see the build job — measured headroom is
      # comfortable (qualithm/pm#451). llvm-cov peaks at ~4G target/ against ~15G free.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      # Own cache key: llvm-cov adds -Cinstrument-coverage to RUSTFLAGS, which
      # invalidates every artifact built without it.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "coverage"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Enforce coverage threshold (>=80%)
        run: |
          awk '/^LF:/ {lf+=substr($0,4)} /^LH:/ {lh+=substr($0,4)} END {
            if (lf == 0) { print "No LF records in lcov.info"; exit 1 }
            pct = (lh / lf) * 100
            printf "Line coverage: %.2f%% (%d/%d)\n", pct, lh, lf
            if (pct + 0 < 80) { print "Coverage below 80% threshold"; exit 1 }
          }' lcov.info
      - name: Fetch Codecov CLI
        id: codecov-cli
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          # A pinned GitHub release instead of the action's runtime download
          # from cli.codecov.io, whose TLS handshake fails from our runners.
          # Bump both values together.
          CODECOV_CLI_VERSION: v11.3.1
          CODECOV_CLI_SHA256: ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/codecov" \
            "https://github.com/codecov/codecov-cli/releases/download/$CODECOV_CLI_VERSION/codecovcli_linux"
          echo "$CODECOV_CLI_SHA256  $RUNNER_TEMP/codecov" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/codecov"
      - name: Upload coverage to Codecov
        id: codecov
        if: ${{ !cancelled() && steps.codecov-cli.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
      - name: Wait before retrying the Codecov upload
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        run: sleep 30
      - name: Retry the Codecov upload
        id: codecov-retry
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
      # Non-blocking by design: Codecov reports coverage, it never gates it, so
      # a Codecov outage must not fail CI Required. A missed upload surfaces
      # as a warning annotation and a job summary line instead.
      - name: Report a failed Codecov upload
        if:
          ${{ !cancelled() && steps.codecov.outcome != 'success' && steps.codecov-retry.outcome !=
          'success' }}
        run: |
          echo "::warning title=Codecov upload failed::coverage was not uploaded to Codecov after a retry"
          echo "Codecov upload failed after a retry. See the upload steps in this job." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 14

  doc:
    name: Documentation
    needs: changes
    # is-main is also true on push to main, which is what seeds this cache key.
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.is-main == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # No "Free disk space" step here either (see the build job): cargo doc
      # --no-deps does no test/bench codegen, so its target/ footprint is the
      # smallest of any job — it never needed the cleanup the others dropped.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "doc"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  benchmark-regression:
    name: Benchmark Regression Check
    needs: changes
    if:
      needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' &&
      needs.changes.outputs.is-main == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # No "Free disk space" step: see the build job — measured headroom is
      # comfortable (qualithm/pm#451); release-profile benches peak well under the ~15G free.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      # Own cache key: benchmarks build the release profile, which shares nothing
      # with the dev-profile artifacts the build job produces.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "bench"
          # This job is PR-only, so this is always false: restore-only. The bench key
          # is seeded by the Benchmark Baseline job on push to main.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Restore baseline from main
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target/criterion
          key: benchmark-baseline-${{ runner.os }}
          restore-keys: |
            benchmark-baseline-${{ runner.os }}
      - name: Run benchmarks and compare against baseline
        run: |
          cargo bench --workspace --bench '*' -- --baseline main 2>&1 | tee benchmark-comparison.txt
          if grep -E "Performance has regressed" benchmark-comparison.txt; then
            echo "::warning::Performance regression detected - review benchmark results"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-comparison
          path: benchmark-comparison.txt
          retention-days: 14

  benchmarks:
    name: Benchmark Baseline
    needs: changes
    if:
      needs.changes.outputs.code == 'true' && github.event_name == 'push' && github.ref ==
      'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # No "Free disk space" step: see the build job — measured headroom is
      # comfortable (qualithm/pm#451); release-profile benches peak well under the ~15G free.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "bench"
      - name: Download baseline
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target/criterion
          key: benchmark-baseline-${{ runner.os }}
          restore-keys: |
            benchmark-baseline-${{ runner.os }}
      - run: cargo bench --workspace --bench '*' -- --save-baseline main
      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target/criterion
          key: benchmark-baseline-${{ runner.os }}-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            target/criterion
            benchmarks/report-*.md
          retention-days: 30

  image-pins:
    name: Image Pins
    # Every image reference in the repo must match the vendored dx registry
    # (Decision qualithm/pm#744, amendment 2026-10-03). Runs on every PR, docs
    # included: a README can carry an image reference too. Repos not enrolled
    # in dx images-sync.config carry no vendored registry and skip.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check image pins against the vendored dx registry
        run: |
          if [ ! -f .github/images/images.config ]; then
            echo "not enrolled in dx images-sync.config; skipping"
            exit 0
          fi
          .github/images/images check --config .github/images/images.config .

  ci-required:
    name: CI Required
    if: always()
    needs: [changes, build, coverage, doc, benchmark-regression, benchmarks, image-pins]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify dependent jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' \
            || { echo "::error::One or more required jobs failed or were cancelled"; exit 1; }
